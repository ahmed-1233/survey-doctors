<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>دليل المسح الميداني</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div dir="rtl" lang="ar">
<header class="hero">
  <div class="wrap">
    <div class="top">
      <div>
        <div class="mark"><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></i>الأطباء والصيدليات</div>
        <h1>دليل المسح الميداني</h1>
      </div>
      <button class="pill solid" id="addBtn" type="button" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span id="addLbl">طبيب جديد</span>
      </button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tabs" role="tablist" aria-label="الأقسام">
      <button type="button" role="tab" data-tab="doc" aria-selected="true">الأطباء <b id="tcDoc"></b></button>
      <button type="button" role="tab" data-tab="ph" aria-selected="false">الصيدليات <b id="tcPh"></b></button>
    </div>
  </div>
</header>
<div class="wrap" id="viewDoc">
  <div class="bar card">
    <label class="search" for="q">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="ابحث بالتخصص والمنطقة… مثال: الحي أطفال" autocomplete="off" enterkeyhint="search">
      <button class="linkbtn" id="clear" type="button" hidden>مسح</button>
    </label>
    <div class="filters">
      <div class="sel"><select id="fArea" aria-label="المنطقة"></select></div>
      <div class="sel"><select id="fSpec" aria-label="التخصص"></select></div>
      <div class="sel"><select id="fCls" aria-label="الفئة">
        <option value="">جميع الفئات</option><option value="A">الفئة A</option><option value="B">الفئة B</option><option value="C">الفئة C</option>
      </select></div>
    </div>
  </div>

  <div class="head">
    <div class="count" id="count" aria-live="polite"></div>
    <button class="pill ghost" id="copy" type="button" hidden>نسخ القائمة</button>
  </div>
  <ul class="list card" id="list">
    <li class="row"><div><span class="av"></span><div class="skel"></div><div class="skel s"></div></div></li>
    <li class="row"><div><span class="av"></span><div class="skel"></div><div class="skel s"></div></div></li>
    <li class="row"><div><span class="av"></span><div class="skel"></div><div class="skel s"></div></div></li>
  </ul>
  <textarea id="copyBuf" aria-hidden="true" tabindex="-1" style="position:absolute;opacity:0;pointer-events:none;height:1px;width:1px"></textarea>

  <div class="foot">
    <span><span class="cls A">A</span>أولوية عالية</span>
    <span><span class="cls B">B</span>متوسطة</span>
    <span><span class="cls C">C</span>منخفضة</span>
    <span id="hint"></span>
  </div>
</div>
<div class="wrap" id="viewPh" hidden>
  <div class="bar card">
    <label class="search" for="pq">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="pq" type="search" placeholder="ابحث باسم الصيدلية أو المنطقة… مثال: الهورة مريم" autocomplete="off" enterkeyhint="search">
      <button class="linkbtn" id="pclear" type="button" hidden>مسح</button>
    </label>
    <div class="filters two-f">
      <div class="sel"><select id="pArea" aria-label="المنطقة"></select></div>
      <div class="sel"><select id="pCls" aria-label="الفئة">
        <option value="">جميع الفئات</option><option value="A+">الفئة A+</option><option value="A">الفئة A</option><option value="B">الفئة B</option><option value="C">الفئة C</option><option value="none">بدون فئة</option>
      </select></div>
    </div>
  </div>

  <div class="head">
    <div class="count" id="pcount" aria-live="polite"></div>
    <button class="pill ghost" id="pcopy" type="button" hidden>نسخ القائمة</button>
  </div>
  <ul class="list card" id="plist">
    <li class="row"><div><span class="av"></span><div class="skel"></div><div class="skel s"></div></div></li>
    <li class="row"><div><span class="av"></span><div class="skel"></div><div class="skel s"></div></div></li>
  </ul>

  <div class="foot">
    <span><span class="cls AP">A+</span>الأعلى</span>
    <span><span class="cls A">A</span>عالية</span>
    <span><span class="cls B">B</span>متوسطة</span>
    <span><span class="cls C">C</span>منخفضة</span>
    <span>اضغط على أي صيدلية لتعديلها، وعلى «أطباء» لعرض أطبائها</span>
  </div>
</div>
</div>

<dialog id="sheet" aria-labelledby="sheetT">
  <form class="sheet" id="form" dir="rtl" lang="ar" novalidate>
    <div class="sheet-h">
      <h2 id="sheetT">طبيب جديد</h2>
      <button class="x" type="button" id="close" aria-label="إغلاق"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sheet-b">
      <div class="field">
        <label for="f-name">اسم الطبيب</label>
        <input id="f-name" autocomplete="off" placeholder="مثال: علي حسن الربيعي">
        <span class="err" id="e-name" hidden></span>
      </div>
      <div class="field">
        <label for="f-spec">التخصص</label>
        <input id="f-spec" list="dl-spec" autocomplete="off" placeholder="اختر تخصصًا أو اكتبه">
        <div class="chipset" id="c-spec"></div>
        <span class="err" id="e-spec" hidden></span>
      </div>
      <div class="field">
        <span class="lbl">الفئة</span>
        <div class="seg" role="radiogroup" aria-label="الفئة">
          <label><input type="radio" name="cls" id="f-clsA" value="A"><span>A</span></label>
          <label><input type="radio" name="cls" id="f-clsB" value="B" checked><span>B</span></label>
          <label><input type="radio" name="cls" id="f-clsC" value="C"><span>C</span></label>
        </div>
      </div>
      <div class="two">
        <div class="field">
          <label for="f-area">المنطقة</label>
          <input id="f-area" list="dl-area" autocomplete="off" placeholder="اختر منطقة أو اكتبها">
          <span class="err" id="e-area" hidden></span>
        </div>
        <div class="field">
          <label for="f-ph">الصيدلية</label>
          <input id="f-ph" list="dl-ph" autocomplete="off" placeholder="اسم الصيدلية">
        </div>
      </div>
      <div class="field">
        <label for="f-note">ملاحظات</label>
        <textarea id="f-note" rows="2" placeholder="اختياري"></textarea>
      </div>
      <div class="stamp" id="stamp"></div>
    </div>
    <div class="sheet-f">
      <button class="pill solid" type="submit" id="saveBtn">حفظ</button>
      <button class="pill ghost" type="button" id="cancel">إلغاء</button>
      <span class="grow"></span>
      <button class="del" type="button" id="delBtn" hidden>حذف</button>
    </div>
  </form>
</dialog>
<dialog id="psheet" aria-labelledby="psheetT">
  <form class="sheet" id="pform" dir="rtl" lang="ar" novalidate>
    <div class="sheet-h">
      <h2 id="psheetT">صيدلية جديدة</h2>
      <button class="x" type="button" id="pclose" aria-label="إغلاق"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sheet-b">
      <div class="field">
        <label for="p-name">اسم الصيدلية</label>
        <input id="p-name" autocomplete="off" placeholder="مثال: الشفاء">
        <span class="err" id="pe-name" hidden></span>
      </div>
      <div class="two">
        <div class="field">
          <label for="p-area">المنطقة</label>
          <input id="p-area" list="dl-parea" autocomplete="off" placeholder="اختر منطقة أو اكتبها">
          <span class="err" id="pe-area" hidden></span>
        </div>
        <div class="field">
          <label for="p-complex">المجمع الطبي</label>
          <input id="p-complex" autocomplete="off" placeholder="اختياري">
        </div>
      </div>
      <div class="field">
        <label for="p-address">العنوان</label>
        <input id="p-address" autocomplete="off" placeholder="مثال: شارع 40">
      </div>
      <div class="field">
        <span class="lbl">الفئة</span>
        <div class="seg" role="radiogroup" aria-label="الفئة">
          <label><input type="radio" name="pcls" id="p-clsN" value="" checked><span>—</span></label>
          <label><input type="radio" name="pcls" id="p-clsAP" value="A+"><span>A+</span></label>
          <label><input type="radio" name="pcls" id="p-clsA" value="A"><span>A</span></label>
          <label><input type="radio" name="pcls" id="p-clsB" value="B"><span>B</span></label>
          <label><input type="radio" name="pcls" id="p-clsC" value="C"><span>C</span></label>
        </div>
      </div>
      <div class="two">
        <div class="field">
          <label for="p-manager">مدير المبيعات</label>
          <input id="p-manager" autocomplete="off" placeholder="اختياري">
        </div>
        <div class="field">
          <label for="p-phone">رقم الهاتف</label>
          <input id="p-phone" type="tel" inputmode="tel" dir="ltr" autocomplete="off" placeholder="07xxxxxxxxx">
        </div>
      </div>
      <div class="field">
        <label for="p-note">ملاحظات</label>
        <textarea id="p-note" rows="2" placeholder="اختياري"></textarea>
      </div>
      <div class="stamp" id="pstamp"></div>
    </div>
    <div class="sheet-f">
      <button class="pill solid" type="submit" id="psaveBtn">حفظ</button>
      <button class="pill ghost" type="button" id="pcancel">إلغاء</button>
      <span class="grow"></span>
      <button class="del" type="button" id="pdelBtn" hidden>حذف</button>
    </div>
  </form>
</dialog>
<datalist id="dl-parea"></datalist><datalist id="dl-spec"></datalist><datalist id="dl-area"></datalist><datalist id="dl-ph"></datalist>
<div class="toast" id="toast" role="status"></div>

  <!-- المكتبات والإعدادات: الترتيب مهم -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pharmacies.js"></script>
</body>
</html>
